[tool.pyright]
include = ["Code"]
extraPaths = ["Code/backend"]
venvPath = "Code/backend"
venv = "venv"

[tool.pyrefly]
python-interpreter-path = "Code/backend/venv/Scripts/python.exe"
search-path = ["Code/backend"]

[tool.pytest.ini_options]
pythonpath = ["Code/backend"]
testpaths = ["Code/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "Code/backend/venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]


# Dependabot configuration for PDF-Lingua
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options

version: 2
updates:
  # 1. Python Backend Dependencies
  - package-ecosystem: "pip"
    directory: "/Code/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # 2. GitHub Actions CI/CD Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  # 3. Docker Container Base Images
  - package-ecosystem: "docker"
    directory: "/Code/backend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"

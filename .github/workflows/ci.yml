name: CI / Automated Testing

on:
  push:
    branches:
      - main
      - master
      - docs
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - docs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Frontend Test Suites (21 Standalone Suites in Pure Node.js)
  # ============================================================================
  frontend-tests:
    name: Frontend Test Suites (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Zero En-dash & Em-dash Character Compliance
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const targetDirs = ['Code/frontend'];
          let totalViolations = 0;

          function scanDirectory(dir) {
            if (!fs.existsSync(dir)) return;
            const items = fs.readdirSync(dir);
            for (const item of items) {
              const fullPath = path.join(dir, item);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                if (item !== 'node_modules' && item !== '.git') {
                  scanDirectory(fullPath);
                }
              } else if (/\.(html|css|js|md)$/.test(item)) {
                const content = fs.readFileSync(fullPath, 'utf8');
                const enDashMatches = (content.match(/\u2013/g) || []).length;
                const emDashMatches = (content.match(/\u2014/g) || []).length;
                if (enDashMatches > 0 || emDashMatches > 0) {
                  console.error('Dash violation in ' + fullPath + ' -> en-dash: ' + enDashMatches + ', em-dash: ' + emDashMatches);
                  totalViolations += (enDashMatches + emDashMatches);
                }
              }
            }
          }

          targetDirs.forEach(scanDirectory);
          if (totalViolations > 0) {
            console.error('\nTotal dash violations detected: ' + totalViolations + '. All text must use standard ASCII hyphen.');
            process.exit(1);
          }
          console.log('Zero en-dash and em-dash character compliance: 100% PASSED');
          "

      - name: Run 21 Frontend Test Suites
        run: |
          node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          const testDir = 'Code/frontend/tests';

          if (!fs.existsSync(testDir)) {
            console.error('Frontend tests directory not found: ' + testDir);
            process.exit(1);
          }

          const testFiles = fs.readdirSync(testDir).filter(f => f.endsWith('.js'));
          console.log('Discovered ' + testFiles.length + ' test suites in ' + testDir + '\n');

          let failedCount = 0;
          const startTime = Date.now();

          for (const file of testFiles) {
            const filePath = testDir + '/' + file;
            try {
              process.stdout.write('[TESTING] ' + file.padEnd(48) + ' ... ');
              execSync('node ' + filePath, { stdio: 'pipe' });
              console.log('PASS');
            } catch (err) {
              console.log('FAIL');
              console.error(err.stdout ? err.stdout.toString() : err.message);
              failedCount++;
            }
          }

          const elapsedSec = ((Date.now() - startTime) / 1000).toFixed(2);
          console.log('\n======================================================');
          console.log('Frontend Suites Result: ' + (testFiles.length - failedCount) + '/' + testFiles.length + ' PASSED in ' + elapsedSec + 's');
          console.log('======================================================');

          if (failedCount > 0) {
            console.error(failedCount + ' test suite(s) failed.');
            process.exit(1);
          }
          "

  # ============================================================================
  # Job 2: Backend Core Tests (Pytest with In-Memory SQLite & Mocks)
  # ============================================================================
  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Code/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "Code/backend/requirements.txt"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Schema
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          SECRET_KEY: "ci-secret-key-for-testing-only-12345678"
          PYTHONPATH: "."
        run: |
          python -c "from app.core.database import init_db; init_db()"

      - name: Run Basic Framework Tests (Code/tests)
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          SECRET_KEY: "ci-secret-key-for-testing-only-12345678"
          PYTHONPATH: "."
        run: |
          python -m pytest ../tests -v

      - name: Run Core Backend Model & Detection Tests (Code/backend/tests)
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          SECRET_KEY: "ci-secret-key-for-testing-only-12345678"
          PYTHONPATH: "."
        run: |
          python -m pytest tests/test_document_model.py tests/test_blank_page.py -o testpaths="" -v
